[project]
name = "echiro-api"
version = "0.1.0"
description = "API do monorepo echiro"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46,<47",
    "fastapi>=0.115,<1",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]
